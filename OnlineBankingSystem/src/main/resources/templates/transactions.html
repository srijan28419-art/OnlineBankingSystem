<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaBank · Online Banking</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">◆</span> Nova<span>Bank</span></div><div class="side-label">WORKSPACE</div><a th:classappend="${page == 'dashboard'} ? 'active'" href="/dashboard">◫ &nbsp; Overview</a><a th:classappend="${page == 'transfer'} ? 'active'" href="/transfer">↗ &nbsp; Send money</a><a th:classappend="${page == 'transactions'} ? 'active'" href="/transactions">☷ &nbsp; Transactions</a><div class="side-bottom"><div class="avatar" th:text="${#strings.substring(user.fullName,0,1)}">A</div><div><b th:text="${user.fullName}">Alice</b><small>Personal account</small></div><form th:action="@{/logout}" method="post"><button class="logout" title="Log out">↪</button></form></div></aside><main class="content"><header><div><div class="eyebrow dark">YOUR ACCOUNT ACTIVITY</div><h1>Transactions</h1><p>A complete record of money sent and received.</p></div><a class="btn primary" href="/transfer">+ New transfer</a></header><div th:if="${success}" class="alert success" th:text="${success}"></div><div class="table-wrap"><table><thead><tr><th>Transaction</th><th>From</th><th>To</th><th>Date</th><th>Amount</th></tr></thead><tbody><tr th:each="tx : ${transactions}"><td><div class="tx-name" th:text="${tx.fromAccount == user.accountNumber ? 'Money sent' : 'Money received'}"></div><small th:text="${tx.description}"></small></td><td th:text="${tx.fromAccount}"></td><td th:text="${tx.toAccount}"></td><td th:text="${#temporals.format(tx.createdAt,'dd MMM yyyy, HH:mm')}"></td><td th:class="${tx.fromAccount == user.accountNumber ? 'negative' : 'positive'}" th:text="${(tx.fromAccount == user.accountNumber ? '- NPR ' : '+ NPR ') + #numbers.formatDecimal(tx.amount,1,'COMMA',2,'POINT')}"></td></tr><tr th:if="${#lists.isEmpty(transactions)}"><td colspan="5" class="empty">No transactions yet. Make your first transfer to see it here.</td></tr></tbody></table></div></main></div></body></html>
